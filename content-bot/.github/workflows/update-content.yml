# Roda o robô a cada 30 min e publica o content.json que o app baixa.
# Este arquivo vai na raiz do repositório PÚBLICO leonida-hub-content.
name: Atualizar conteúdo

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: ["base.json", "sources.json", "update.py"]

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do robô
        run: python -m unittest -v
      - name: Buscar notícias e vídeos
        run: python update.py --out content.json
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- content.json; then echo "sem mudanças"; exit 0; fi
          git config user.name "leonida-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json
          git commit -m "conteúdo: atualização automática"
          git push
